  android-test_github-ubuntu-2404_phone:
    name: 'Android Instrumented Test (api=30 & 36, arch=x86_64)'
    runs-on:
    - 'ubuntu-24.04'
    permissions:
      actions: 'write'
    steps:
    - id: 'step-0'
      uses: 'actions/checkout@v4'
      with:
        submodules: 'recursive'
    - id: 'step-1'
      name: 'Free space for Ubuntu'
      uses: 'jlumbroso/free-disk-space@v1.3.1'
      with:
        android: 'false'
        large-packages: 'false'
        tool-cache: 'false'
    - id: 'step-2'
      name: 'Enable Swap'
      run: |-
        sudo fallocate -l 10G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
    - id: 'step-3'
      continue-on-error: true
      run: 'rm local.properties'
    - id: 'step-4'
      continue-on-error: true
      run: |
        echo "ani.android.abis=all" >> local.properties
        echo "ani.dandanplay.app.id=${{ secrets.DANDANPLAY_APP_ID }}" >> local.properties
        echo "ani.dandanplay.app.secret=${{ secrets.DANDANPLAY_APP_SECRET }}" >> local.properties
        echo "ani.sentry.dsn=${{ secrets.SENTRY_DSN }}" >> local.properties
        echo "kotlin.native.ignoreDisabledTargets=true" >> local.properties
    - id: 'step-5'
      continue-on-error: true
      run: |
        echo "ani.enable.firebase=true" >> local.properties
        echo "firebase.ga.app.id=${{ secrets.FIREBASE_GA_APP_ID }}" >> local.properties
        echo "firebase.ga.api.secret=${{ secrets.FIREBASE_GA_API_SECRET }}" >> local.properties
      if: '${{ (github.repository == ''open-ani/animeko'') && ((!(github.event_name == ''pull_request'')) || (github.event.pull_request.head.repo.full_name == github.repository)) }}'
    - id: 'step-6'
      name: 'Get JBR (Windows)'
      env:
        RUNNER_TOOL_CACHE: '${{ runner.tool_cache }}'
        JBR_URL: 'https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk_jcef-21.0.11-linux-x64-b1163.116.tar.gz'
        JBR_CHECKSUM_URL: 'https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk_jcef-21.0.11-linux-x64-b1163.116.tar.gz.checksum'
      shell: 'bash'
      run: 'python .github/workflows/download_jbr.py'
    - id: 'step-7'
      name: 'Setup JBR 21 for Ubuntu'
      uses: 'gmitch215/setup-java@6d2c5e1f82f180ae79f799f0ed6e3e5efb4e664d'
      with:
        java-version: '21'
        distribution: 'jdkfile'
        jdkFile: '${{ steps.step-6.outputs.jbrLocation }}'
      env:
        GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
    - id: 'step-8'
      name: 'Dump Local Properties'
      run: 'echo "jvm.toolchain.version=21" >> local.properties'
    - id: 'step-9'
      run: 'chmod -R 777 .'
    - id: 'step-10'
      name: 'Setup Gradle'
      uses: 'gradle/actions/setup-gradle@v3'
      with:
        cache-disabled: 'true'
    - id: 'step-11'
      name: 'Clean and download dependencies (Attempt #1)'
      continue-on-error: true
      timeout-minutes: 180
      run: './gradlew --scan "--stacktrace" "-Porg.gradle.daemon.idletimeout=60000" "-Dfile.encoding=UTF-8" "-Dorg.gradle.jvmargs=-Xmx8g -Dkotlin.daemon.jvm.options=-Xmx6g" "-Dkotlin.daemon.jvm.options=-Xmx6g"'
    - id: 'step-12'
      name: 'Clean and download dependencies (Attempt #2)'
      continue-on-error: false
      timeout-minutes: 180
      run: './gradlew --scan "--stacktrace" "-Porg.gradle.daemon.idletimeout=60000" "-Dfile.encoding=UTF-8" "-Dorg.gradle.jvmargs=-Xmx8g -Dkotlin.daemon.jvm.options=-Xmx6g" "-Dkotlin.daemon.jvm.options=-Xmx6g"'
      if: '${{ steps.step-11.outcome == ''failure'' }}'
    - id: 'step-13'
      name: 'Enable KVM'
      run: |-
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - id: 'step-14'
      name: 'Build Android Instrumented Tests (Attempt #1)'
      continue-on-error: true
      timeout-minutes: 180
      run: './gradlew assembleAndroidDeviceTest -x :app:shared:tv:assembleAndroidDeviceTest -x :app:shared:ui-foundation-tv:assembleAndroidDeviceTest -x :app:shared:ui-settings-tv:assembleAndroidDeviceTest -x :app:shared:ui-subject-tv:assembleAndroidDeviceTest -x :app:shared:ui-exploration-tv:assembleAndroidDeviceTest -x :app:shared:ui-onboarding-tv:assembleAndroidDeviceTest -x :app:shared:ui-episode-tv:assembleAndroidDeviceTest -x :app:shared:ui-watchtogether-tv:assembleAndroidDeviceTest "-Pandroid.min.sdk=30" "--scan" "-Porg.gradle.daemon.idletimeout=60000" "-Dfile.encoding=UTF-8" "-Dorg.gradle.jvmargs=-Xmx8g -Dkotlin.daemon.jvm.options=-Xmx6g" "-Dkotlin.daemon.jvm.options=-Xmx6g"'
    - id: 'step-15'
      name: 'Build Android Instrumented Tests (Attempt #2)'
      continue-on-error: true
      timeout-minutes: 180
      run: './gradlew assembleAndroidDeviceTest -x :app:shared:tv:assembleAndroidDeviceTest -x :app:shared:ui-foundation-tv:assembleAndroidDeviceTest -x :app:shared:ui-settings-tv:assembleAndroidDeviceTest -x :app:shared:ui-subject-tv:assembleAndroidDeviceTest -x :app:shared:ui-exploration-tv:assembleAndroidDeviceTest -x :app:shared:ui-onboarding-tv:assembleAndroidDeviceTest -x :app:shared:ui-episode-tv:assembleAndroidDeviceTest -x :app:shared:ui-watchtogether-tv:assembleAndroidDeviceTest "-Pandroid.min.sdk=30" "--scan" "-Porg.gradle.daemon.idletimeout=60000" "-Dfile.encoding=UTF-8" "-Dorg.gradle.jvmargs=-Xmx8g -Dkotlin.daemon.jvm.options=-Xmx6g" "-Dkotlin.daemon.jvm.options=-Xmx6g"'
      if: '${{ steps.step-14.outcome == ''failure'' }}'
    - id: 'step-16'
      name: 'Build Android Instrumented Tests (Attempt #3)'
      continue-on-error: false
      timeout-minutes: 180
      run: './gradlew assembleAndroidDeviceTest -x :app:shared:tv:assembleAndroidDeviceTest -x :app:shared:ui-foundation-tv:assembleAndroidDeviceTest -x :app:shared:ui-settings-tv:assembleAndroidDeviceTest -x :app:shared:ui-subject-tv:assembleAndroidDeviceTest -x :app:shared:ui-exploration-tv:assembleAndroidDeviceTest -x :app:shared:ui-onboarding-tv:assembleAndroidDeviceTest -x :app:shared:ui-episode-tv:assembleAndroidDeviceTest -x :app:shared:ui-watchtogether-tv:assembleAndroidDeviceTest "-Pandroid.min.sdk=30" "--scan" "-Porg.gradle.daemon.idletimeout=60000" "-Dfile.encoding=UTF-8" "-Dorg.gradle.jvmargs=-Xmx8g -Dkotlin.daemon.jvm.options=-Xmx6g" "-Dkotlin.daemon.jvm.options=-Xmx6g"'
      if: '${{ steps.step-15.outcome == ''failure'' }}'
    - id: 'step-17'
      name: 'Stop Gradle daemons before emulator (api=30, arch=x86_64)'
      run: |-
        ./gradlew --stop
        pkill -f KotlinCompileDaemon || true
        free -h
        df -h .
    - id: 'step-18'
      name: 'Android Instrumented Test (api=30, arch=x86_64)'
      continue-on-error: true
      timeout-minutes: 60
      uses: 'reactivecircus/android-emulator-runner@v2.35.0'
      with:
        api-level: '30'
        target: 'default'
        arch: 'x86_64'
        profile: 'pixel_2'
        ram-size: '2048M'
        emulator-boot-timeout: '1800'
        script: 'touch android-instrumented-test-started-api30-x86_64; ./ci-helper/prepare-android-emulator.sh; ./ci-helper/run-android-device-tests.sh logcat-api30-x86_64.txt connectedDeviceTest -x :app:shared:tv:connectedDeviceTest -x :app:shared:ui-foundation-tv:connectedDeviceTest -x :app:shared:ui-settings-tv:connectedDeviceTest -x :app:shared:ui-subject-tv:connectedDeviceTest -x :app:shared:ui-exploration-tv:connectedDeviceTest -x :app:shared:ui-onboarding-tv:connectedDeviceTest -x :app:shared:ui-episode-tv:connectedDeviceTest -x :app:shared:ui-watchtogether-tv:connectedDeviceTest --continue "-Pandroid.min.sdk=30" "--scan" "-Porg.gradle.daemon.idletimeout=60000" "-Dfile.encoding=UTF-8" "-Dorg.gradle.jvmargs=-Xmx3g -Dkotlin.daemon.jvm.options=-Xmx2g" "-Dkotlin.daemon.jvm.options=-Xmx2g"; status=$?; killall -INT crashpad_handler || true; exit $status'
    - id: 'step-19'
      name: 'Android Instrumented Test (api=30, arch=x86_64) (Retry after emulator failure)'
      continue-on-error: true
      timeout-minutes: 60
      uses: 'reactivecircus/android-emulator-runner@v2.35.0'
      with:
        api-level: '30'
        target: 'default'
        arch: 'x86_64'
        profile: 'pixel_2'
        ram-size: '2048M'
        emulator-boot-timeout: '1800'
        script: 'touch android-instrumented-test-started-api30-x86_64; ./ci-helper/prepare-android-emulator.sh; ./ci-helper/run-android-device-tests.sh logcat-api30-x86_64.txt connectedDeviceTest -x :app:shared:tv:connectedDeviceTest -x :app:shared:ui-foundation-tv:connectedDeviceTest -x :app:shared:ui-settings-tv:connectedDeviceTest -x :app:shared:ui-subject-tv:connectedDeviceTest -x :app:shared:ui-exploration-tv:connectedDeviceTest -x :app:shared:ui-onboarding-tv:connectedDeviceTest -x :app:shared:ui-episode-tv:connectedDeviceTest -x :app:shared:ui-watchtogether-tv:connectedDeviceTest --continue "-Pandroid.min.sdk=30" "--scan" "-Porg.gradle.daemon.idletimeout=60000" "-Dfile.encoding=UTF-8" "-Dorg.gradle.jvmargs=-Xmx3g -Dkotlin.daemon.jvm.options=-Xmx2g" "-Dkotlin.daemon.jvm.options=-Xmx2g"; status=$?; killall -INT crashpad_handler || true; exit $status'
      if: '${{ (steps.step-18.outcome == ''failure'') && (hashFiles(''android-instrumented-test-started-api30-x86_64'') == '''') }}'
