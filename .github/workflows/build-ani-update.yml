# 构建 Windows 更新器 tools/ani-update, 产物作为 artifact 上传.
# 应用打包时用的是提交在 app/desktop/appResources/windows/ani_update.exe 的二进制,
# 改了更新器源码后从这里下载 artifact 换掉它.
name: Build ani_update

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/ani-update/**'
      - '.github/workflows/build-ani-update.yml'

jobs:
  build:
    name: Build ani_update.exe
    runs-on: windows-2022
    defaults:
      run:
        working-directory: tools/ani-update
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: cargo test --release --locked
      - name: Build
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: ani_update
          path: tools/ani-update/target/release/ani_update.exe
          if-no-files-found: error
